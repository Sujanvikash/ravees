# The billing API on the server: PostgreSQL, the API, Caddy (HTTPS, for the shop API too) and a nightly database backup.
# Lives in ~/billing on the server next to .env and Caddyfile; CI copies it there on every deploy.
#   docker compose up -d                                   start or update everything
#   docker compose exec api python -m app.cli seed         fill the database (first time)

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: billing
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: raaves_billing
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billing -d raaves_billing"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ${API_IMAGE:?set API_IMAGE in .env}
    restart: unless-stopped
    env_file: .env
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://billing:${POSTGRES_PASSWORD}@db:5432/raaves_billing
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in .env}
      # the website's shop API (ecommerce/deploy), served by this Caddy too
      SHOP_API_DOMAIN: ${SHOP_API_DOMAIN:-shop-api.localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - default
      - web
    depends_on:
      - api

  # A pg_dump every night at about 02:00 IST into ./backups, keeping the last 14 days.
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: billing
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: raaves_billing
      TZ: Asia/Kolkata
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          # seconds until the next 02:00 IST (UTC+5:30 = 19800 s)
          sleep $$(( (86400 + 7200 - ($$(date +%s) + 19800) % 86400) % 86400 + 1 ))
          pg_dump -Fc -f /backups/billing-$$(date +%Y-%m-%d).dump && echo "backup done $$(date)"
          find /backups -name 'billing-*.dump' -mtime +14 -delete
        done
    depends_on:
      db:
        condition: service_healthy

networks:
  # shared with the shop API (ecommerce/deploy); the deploy scripts make it (docker network create web)
  web:
    external: true

volumes:
  pgdata:
  caddy_data:
  caddy_config:
