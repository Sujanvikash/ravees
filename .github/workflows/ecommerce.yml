# Shop website CI/CD.
#   every push and pull request touching ecommerce/: backend lint + tests (on a throwaway PostgreSQL), frontend lint + build
#   a push to main: also builds the shop API image, pushes it to GHCR and deploys it to the shop's own server over SSH
# The website itself is deployed by Cloudflare Pages from main (see ecommerce/deploy/README.md), not here.
#
# Secrets the deploy needs, in the production environment: SHOP_DEPLOY_HOST, SHOP_DEPLOY_USER, SHOP_DEPLOY_SSH_KEY.

name: ecommerce

on:
  push:
    branches: [main, rohit, sujan]
    paths: ['ecommerce/**', '.github/workflows/ecommerce.yml']
  pull_request:
    paths: ['ecommerce/**', '.github/workflows/ecommerce.yml']
  workflow_dispatch:

concurrency:
  group: ecommerce-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ecommerce/backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: shop
          POSTGRES_PASSWORD: shop
          POSTGRES_DB: raaves_shop_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U shop" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      UV_PYTHON_DOWNLOADS: never
      TEST_DATABASE_URL: postgresql+psycopg://shop:shop@localhost:5432/raaves_shop_test
    steps:
      - uses: actions/checkout@v4
      # Python from the runner's own toolcache: uv would otherwise download it from GitHub releases, which
      # timed out (504) and failed every run
      - uses: actions/setup-python@v5
        with:
          python-version-file: ecommerce/backend/.python-version
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.22'
          enable-cache: true
          cache-dependency-glob: ecommerce/backend/uv.lock
      - name: Install dependencies
        run: |
          # on failure, put the end of uv's output in an annotation so the cause shows without opening the log
          uv sync --frozen 2>&1 | tee /tmp/uv-sync.log; status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then echo "::error title=uv sync failed::$(tail -n 12 /tmp/uv-sync.log | paste -sd'|' - | cut -c1-900)"; fi
          exit $status
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ecommerce/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ecommerce/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/raaves-shop-api" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ecommerce/backend
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha,scope=shop-api
          cache-to: type=gha,mode=max,scope=shop-api

      - name: Copy compose files to the server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SHOP_DEPLOY_HOST }}
          username: ${{ secrets.SHOP_DEPLOY_USER }}
          key: ${{ secrets.SHOP_DEPLOY_SSH_KEY }}
          source: ecommerce/deploy/compose.yml,ecommerce/deploy/Caddyfile
          target: ecommerce
          strip_components: 2

      # Plain ssh from the runner: the appleboy ssh action downloads its own tool from GitHub releases on every run,
      # and those downloads returned 504 and failed the deploy
      - name: Pull and restart on the server
        env:
          IMAGE: ${{ steps.image.outputs.name }}:${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_SSH_KEY: ${{ secrets.SHOP_DEPLOY_SSH_KEY }}
          DEPLOY_TARGET: ${{ secrets.SHOP_DEPLOY_USER }}@${{ secrets.SHOP_DEPLOY_HOST }}
        run: |
          install -m 600 /dev/null ~/deploy_key
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/deploy_key
          {
            printf 'IMAGE=%q GHCR_USER=%q GHCR_TOKEN=%q\n' "$IMAGE" "$GHCR_USER" "$GHCR_TOKEN"
            cat ecommerce/deploy/remote-deploy.sh
          } | ssh -i ~/deploy_key -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 "$DEPLOY_TARGET" bash -s
